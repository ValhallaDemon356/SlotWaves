; SlotWaves — PHP configuration for Vercel serverless runtime
; This file is picked up by vercel-php@0.7.4 automatically.

; ── Memory & Execution ───────────────────────────────────────────────────────
memory_limit = 512M
max_execution_time = 30
post_max_size = 25M
upload_max_filesize = 25M

; ── Required Extensions ──────────────────────────────────────────────────────
extension = pdo_pgsql
extension = pgsql
extension = openssl
extension = fileinfo
extension = mbstring
extension = tokenizer
extension = xml
extension = ctype
extension = json
extension = bcmath
extension = gd

; ── Error Handling ───────────────────────────────────────────────────────────
; Suppress browser error output (errors go to Vercel function logs via stderr)
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
