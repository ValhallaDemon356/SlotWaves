; SlotWaves — PHP runtime configuration for vercel-php
;
; IMPORTANT: Do NOT add "extension = ..." directives here.
; All extensions (pdo_pgsql, pgsql, openssl, mbstring, fileinfo, gd, bcmath, etc.)
; are statically compiled into the vercel-php binary. Loading them explicitly causes:
;   PHP Fatal: Cannot load module 'X' because already loaded
; which makes the function return HTTP 500 in ~13ms.
;
; This file should contain ONLY php.ini settings (memory, limits, error handling).

; ── Memory & Execution ───────────────────────────────────────────────────────
memory_limit = 512M
max_execution_time = 30

; ── Upload Limits ─────────────────────────────────────────────────────────────
; SlotWaves uploads PDF flight schedules. 25MB provides headroom above the 20MB
; validation limit defined in UploadController.
post_max_size = 25M
upload_max_filesize = 25M

; ── Error Handling ───────────────────────────────────────────────────────────
; Suppress HTML error output — all errors must go to Vercel function logs (stderr).
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
